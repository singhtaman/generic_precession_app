[pytest]
testpaths = tests
addopts = -ra
markers =
    ui: browser tests (need Playwright and Chromium; skipped otherwise)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Wswiglal-redir-stdio
    # known divide-by-zero in the model's precession_angles() at degenerate orientations
    ignore::RuntimeWarning:generic_precession_no_match
