# Runs the full test suite for the redesigned app (Vercel) on every push and pull request.
# Browser tests (tests/test_ui.py) are skipped here because Playwright is not installed.
name: tests

on:
  push:
    branches: [feature/vercel-ui]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # Vercel's default runtime
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
